<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Arc diagram interativo</title>
<script src="widget_files/d3.v7.min.js"></script>
<script src="widget_files/data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
  #wrapper { display: flex; flex-direction: column; }
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 20px;
    padding: 10px 14px;
    border-bottom: 1px solid #eee;
  }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #333; }
  .legend-swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  #hint { font-size: 12px; color: #888; white-space: nowrap; }
  #chart-container { width: 100%; cursor: grab; }
  #chart-container:active { cursor: grabbing; }
  .arc { fill: none; stroke-width: 1.4px; transition: opacity 0.15s, stroke-width 0.15s; }
  .arc.pinned { stroke-width: 3px; }
  .node-label { font-size: 9px; fill: #333; text-anchor: middle; transition: opacity 0.15s, font-weight 0.15s; }
  .node-circle { stroke: #ffffff; stroke-width: 1px; cursor: pointer; transition: r 0.15s; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(30, 30, 30, 0.92);
    color: #fff;
    padding: 4px 9px;
    border-radius: 4px;
    font-size: 12px;
    font-family: sans-serif;
    opacity: 0;
    transition: opacity 0.1s;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrapper">
  <div id="topbar">
    <div id="legend"></div>
    <div id="hint">arraste p/ mover · scroll p/ zoom · clique num arco pra fixar · duplo-clique reseta</div>
  </div>
  <div id="chart-container"></div>
</div>
<div id="tooltip"></div>
<script>
// Arc diagram feito a mao em D3.js puro -- nao existe pacote R com versao
// interativa pronta pra esse tipo de grafico (ver README.md da pasta).
// nodes / links / groupColor vem de widget_files/data.js, gerado pelo
// script.R -- fonte unica de verdade entre a versao estatica e esta.

// Legenda e dica ficam em HTML normal (fora do SVG) -- dentro do SVG elas
// encolhiam junto com o viewBox largo (rede grande = viewBox grande = texto
// minusculo depois de reescalado pra caber na tela), o que deixava ilegivel.
const legendDiv = d3.select("#legend");
const gruposUnicos = [...new Set(nodes.map(d => d.group))];
const legendItems = legendDiv.selectAll(".legend-item")
  .data(gruposUnicos)
  .join("div")
    .attr("class", "legend-item");
legendItems.append("span").attr("class", "legend-swatch")
  .style("background", d => groupColor[d]);
legendItems.append("span").text(d => d);

const margin = {top: 20, right: 20, bottom: 30, left: 20};
const width = Math.max(900, nodes.length * 42);

const x = d3.scalePoint()
  .domain(nodes.map(d => d.name))
  .range([margin.left, width - margin.right])
  .padding(0.5);

// altura dinamica: precisa caber o maior arco (a ponte mais longa)
const maxArcR = d3.max(links, d => Math.abs(x(d.target) - x(d.source)) / 2) || 100;
const bottomSpace = 40;
const height = maxArcR + margin.top + bottomSpace;
const baseline = height - bottomSpace;

const svg = d3.select("#chart-container").append("svg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("width", "100%")
  .style("display", "block");

// camada que sofre pan/zoom
const zoomLayer = svg.append("g");

function arcPath(d) {
  const x1 = x(d.source), x2 = x(d.target);
  const r = Math.abs(x2 - x1) / 2;
  const sweep = x1 < x2 ? 1 : 0;
  return `M ${x1} ${baseline} A ${r} ${r} 0 0 ${sweep} ${x2} ${baseline}`;
}

const nodeByName = new Map(nodes.map(d => [d.name, d]));
const neighbors = new Map(nodes.map(d => [d.name, new Set()]));
links.forEach(l => {
  neighbors.get(l.source).add(l.target);
  neighbors.get(l.target).add(l.source);
});
function linkKey(d) { return d.source + "->" + d.target; }

const tooltip = d3.select("#tooltip");
function showTooltip(html, event) {
  tooltip.html(html)
    .style("left", (event.pageX + 12) + "px")
    .style("top", (event.pageY - 10) + "px")
    .style("opacity", 1);
}
function hideTooltip() {
  tooltip.style("opacity", 0);
}

// arcos clicados ficam "fixados" (destacados mesmo sem hover) ate serem
// clicados de novo ou o duplo-clique resetar tudo
const pinned = new Set();

// hoverPredicate(d) -> true se o arco deve ficar em destaque agora; null
// significa "sem hover, mostra so o que estiver fixado"
function refreshArcs(hoverPredicate) {
  arcs
    .classed("pinned", d => pinned.has(linkKey(d)))
    .attr("opacity", d => {
      if (pinned.has(linkKey(d))) return 1;
      if (hoverPredicate) return hoverPredicate(d) ? 1 : 0.04;
      return 0.35;
    })
    .attr("stroke-width", d => {
      if (pinned.has(linkKey(d))) return 3;
      if (hoverPredicate && hoverPredicate(d)) return 3;
      return 1.4;
    });
}

const arcs = zoomLayer.append("g").selectAll("path")
  .data(links)
  .join("path")
    .attr("class", "arc")
    .attr("d", arcPath)
    .attr("stroke", d => groupColor[nodeByName.get(d.source).group])
    .attr("opacity", 0.35)
    .on("mouseover", function(event, d) {
      refreshArcs(l => l === d);
      showTooltip(`${d.source} &rarr; ${d.target}${pinned.has(linkKey(d)) ? " (fixado)" : ""}`, event);
    })
    .on("mousemove", (event, d) => showTooltip(`${d.source} &rarr; ${d.target}${pinned.has(linkKey(d)) ? " (fixado)" : ""}`, event))
    .on("mouseout", function() {
      refreshArcs(null);
      hideTooltip();
    })
    .on("click", function(event, d) {
      const key = linkKey(d);
      if (pinned.has(key)) pinned.delete(key); else pinned.add(key);
      refreshArcs(l => l === d);
    });

const nodeG = zoomLayer.append("g").selectAll("g")
  .data(nodes)
  .join("g")
    .attr("transform", d => `translate(${x(d.name)}, ${baseline})`);

nodeG.append("circle")
    .attr("class", "node-circle")
    .attr("r", 5)
    .attr("fill", d => groupColor[d.group]);

nodeG.append("text")
    .attr("class", "node-label")
    .attr("y", 16)
    .text(d => d.name);

nodeG
  .on("mouseover", function(event, d) {
    const connected = neighbors.get(d.name);
    refreshArcs(l => l.source === d.name || l.target === d.name);
    nodeG.select("text").attr("opacity", n => n.name === d.name || connected.has(n.name) ? 1 : 0.25);
    d3.select(this).select("circle").attr("r", 8);
    showTooltip(`<b>${d.name}</b><br>${d.group}<br>${connected.size} conexão(ões)`, event);
  })
  .on("mousemove", (event) => showTooltip(tooltip.html(), event))
  .on("mouseout", function() {
    refreshArcs(null);
    nodeG.select("text").attr("opacity", 1);
    d3.select(this).select("circle").attr("r", 5);
    hideTooltip();
  });

// Pan (arrastar) e zoom (scroll / pinça) -- a rede fica larga demais pra
// caber inteira e legivel ao mesmo tempo, entao dá pra navegar por ela
const zoom = d3.zoom()
  .scaleExtent([0.4, 10])
  .on("zoom", (event) => {
    zoomLayer.attr("transform", event.transform);
  });
svg.call(zoom).on("dblclick.zoom", null);
svg.on("dblclick", () => {
  svg.call(zoom.transform, d3.zoomIdentity);
  pinned.clear();
  refreshArcs(null);
});
</script>
</body>
</html>
